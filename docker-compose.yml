version: '3.9'
services:
  postgres:
    image: ankane/pgvector:latest
    container_name: ai-agent-builder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_agent_builder
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-agent-builder-api
    depends_on:
      - postgres
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_agent_builder?schema=public
      JWT_SECRET: change-me
      CORS_ORIGIN: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
      PUBLIC_API_BASE_URL: http://localhost:4000
      WIDGET_BASE_URL: http://localhost:3000
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ai-agent-builder-web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - '3000:3000'

volumes:
  postgres_data:
